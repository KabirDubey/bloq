[package]
name = "low-gadgets"
version = "0.0.0"
edition = "2024"
publish = false
description = "Low et al. (arXiv:2605.30455) gadgets built from bloq primitives outside the compile pipeline (L3)."

# Own workspace: this package is not a member of the bloq workspace.
[workspace]

[dependencies]
bloq_circuit = { path = "../../bloq_circuit" }
bloq_stim = { path = "../../bloq_stim", features = ["verify"] }
glam = "0.33.2"
